name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.outputs.outputs.released }}
      version: ${{ steps.outputs.outputs.version }}
      tag: ${{ steps.outputs.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --minimum-release-age=21600 semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github

      - name: Create config
        run: |
          cat <<EOF > .releaserc.json
          {
            "branches": ["main"],
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator",
              "@semantic-release/github"
            ]
          }
          EOF

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --minimum-release-age=21600 semantic-release

      - name: Resolve release outputs
        id: outputs
        run: |
          set -eou pipefail
          if tag=$(git describe --tags --exact-match HEAD 2>/dev/null); then
            echo "released=true" >>"$GITHUB_OUTPUT"
            echo "version=${tag#v}" >>"$GITHUB_OUTPUT"
            echo "tag=$tag" >>"$GITHUB_OUTPUT"
          else
            echo "released=false" >>"$GITHUB_OUTPUT"
          fi

  discover:
    name: Discover services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: List services
        id: list
        run: |
          services=$(
            find cmd -mindepth 1 -maxdepth 1 -type d | xargs -I{} basename {} | sort | while read -r svc; do
              [ -f "cmd/${svc}/Containerfile" ] || [ -f "Containerfile" ] && echo "$svc"
            done | jq -R . | jq -sc .
          )
          echo "matrix={\"service\":$services}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.service }}
    needs:
      - release
      - discover
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run code generators
        run: go generate ./...

      - name: Check if service changed
        id: changed
        env:
          MODULE: github.com/nicklasfrahm-dev/platform
          SERVICE: ${{ matrix.service }}
          NEW_TAG: ${{ needs.release.outputs.tag }}
        run: |
          prev_tag=$(git describe --tags --abbrev=0 "${NEW_TAG}^" 2>/dev/null || true)

          if [ -z "$prev_tag" ]; then
            echo "No previous tag — treating service as changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If workflow files changed, treat all services as changed
          if git diff --name-only "${prev_tag}" HEAD -- .github/workflows/ | grep -q .; then
            echo "Workflow files changed — treating all services as changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolve internal pkg/ packages this service depends on
          pkg_paths=$(go list -deps "./cmd/${SERVICE}/..." 2>/dev/null \
            | grep "^${MODULE}/pkg/" \
            | sed "s|${MODULE}/||")

          # Build the set of paths to diff
          paths=("cmd/${SERVICE}")
          while IFS= read -r pkg; do
            [ -n "$pkg" ] && paths+=("$pkg")
          done <<< "$pkg_paths"

          if git diff --name-only "${prev_tag}" HEAD -- "${paths[@]}" | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=false" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.changed.outputs.changed == 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        if: steps.changed.outputs.changed == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        if: steps.changed.outputs.changed == 'true'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        if: steps.changed.outputs.changed == 'true'
        id: tags
        env:
          SERVICE: ${{ matrix.service }}
          VERSION: ${{ needs.release.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "value<<EOF"
            echo "ghcr.io/${{ github.repository }}/${SERVICE}:${VERSION}"
            [ "${REF_NAME}" = "main" ] && echo "ghcr.io/${{ github.repository }}/${SERVICE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve Containerfile
        if: steps.changed.outputs.changed == 'true'
        id: containerfile
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          file="cmd/${SERVICE}/Containerfile"
          [ -f "$file" ] || file="Containerfile"
          echo "path=$file" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        if: steps.changed.outputs.changed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ steps.containerfile.outputs.path }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ needs.release.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
