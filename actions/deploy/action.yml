name: Deploy
description: "Deploy a service to a specified environment by updating the image tag in the configuration repository."
branding:
  icon: server
  color: gray-dark
inputs:
  environment:
    description: "The target environment (dev, stg, prd)"
    required: true
  service:
    description: "The service to deploy (cilium, argocd, etc.)"
    required: true
  tag:
    description: "The image tag to deploy"
    required: true
  github-ssh-key:
    description: "An SSH key with write access to use for GitHub authentication"
    required: true

runs:
  using: composite
  steps:
    - name: Checkout configuration repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        repository: nicklasfrahm-dev/platform
        ssh-key: ${{ inputs.github-ssh-key }}

    - name: Validate service
      shell: bash
      run: |
        set -eou pipefail

        if [[ ! -d "deploy/services/${{ inputs.service }}" ]]; then
          echo "Failed to validate service: ${{ inputs.service }}"
          echo "Service directory does not exist: deploy/services/${{ inputs.service }}"
          exit 1
        fi

    - name: Validate environment
      shell: bash
      run: |
        set -eou pipefail

        environments=("dev" "stg" "prd")
        valid=false
        for env in "${environments[@]}"; do
          if [[ "${{ inputs.environment }}" == "$env" ]]; then
            valid=true
            break
          fi
        done

        if [[ "$valid" == false ]]; then
          echo "Failed to validate environment: ${{ inputs.environment }}"
          echo "Must be one of: ${environments[*]}"
          exit 1
        fi

    - name: Install yq
      uses: dcarbone/install-yq-action@4075b4dca348d74bd83f2bf82d30f25d7c54539b # v1.3.1

    - name: Create GitHub deployment
      id: create-deployment
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SERVICE: ${{ inputs.service }}
        ENVIRONMENT: ${{ inputs.environment }}
        TAG: ${{ inputs.tag }}
        REF: ${{ github.sha }}
      run: |
        set -uo pipefail

        PAYLOAD=$(jq -n \
          --arg ref "$REF" \
          --arg environment "$ENVIRONMENT" \
          --arg description "Deploy ${SERVICE} ${TAG} to ${ENVIRONMENT}" \
          '{ref: $ref, environment: $environment, description: $description, auto_merge: false, required_contexts: []}')

        if ! RESPONSE=$(gh api "repos/${GITHUB_REPOSITORY}/deployments" \
          --method POST \
          --input - <<<"$PAYLOAD" 2>&1); then
          if echo "$RESPONSE" | grep -qE "\(HTTP (401|403|404)\)"; then
            echo "::warning::Skipping GitHub deployment tracking: request failed with 401/403/404, likely missing the 'deployments: write' permission."
            echo "id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$RESPONSE" >&2
          exit 1
        fi

        echo "id=$(jq -r '.id' <<<"$RESPONSE")" >> "$GITHUB_OUTPUT"

    - name: Update image tag in environment file
      shell: bash
      run: |
        set -eou pipefail

        ENV_FILE="deploy/services/${{ inputs.service }}/10-env-${{ inputs.environment }}.yml"

        # Ensure the environment file exists.
        touch "$ENV_FILE"

        # Update the image tag using yq.
        yq -i '.image.tag = strenv(IMAGE_TAG)' "$ENV_FILE"
      env:
        IMAGE_TAG: ${{ inputs.tag }}

    - name: Commit and push changes
      id: commit-and-push
      shell: bash
      run: |
        set -eou pipefail

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git add "deploy/services/${{ inputs.service }}/10-env-${{ inputs.environment }}.yml"

        if git commit -m "chore(deploy): deploy ${{ inputs.service }} ${{ inputs.tag }} to ${{ inputs.environment }}"; then
          git push origin main
        fi

    - name: Update GitHub deployment status
      if: ${{ !cancelled() && steps.create-deployment.outputs.id != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DEPLOYMENT_ID: ${{ steps.create-deployment.outputs.id }}
        STATE: ${{ steps.commit-and-push.outcome == 'success' && 'success' || 'failure' }}
        SERVICE: ${{ inputs.service }}
        ENVIRONMENT: ${{ inputs.environment }}
        TAG: ${{ inputs.tag }}
      run: |
        set -eou pipefail

        gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
          --method POST \
          -f "state=${STATE}" \
          -f "description=Deploy ${SERVICE} ${TAG} to ${ENVIRONMENT}"
