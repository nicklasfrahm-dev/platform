{{ template "header.html" . }}

<div class="theme-panel w-full">
  <h2 class="theme-heading text-base text-neutral-100 mb-6">Enter User Code</h2>
  <form method="post" action="{{ .PostURL }}">
    <div class="theme-form-row mb-4">
      {{ if( .UserCode  )}}
      <input tabindex="2" required id="user_code" name="user_code" type="text" class="theme-form-input block w-full rounded-lg border border-neutral-700 bg-neutral-900 px-3 py-2 text-sm text-neutral-100 focus:outline-none focus:border-accent" autocomplete="off" value="{{.UserCode}}" {{ if .Invalid }} autofocus {{ end }}/>
      {{ else }}
      <input tabindex="2" required id="user_code" name="user_code" type="text" class="theme-form-input block w-full rounded-lg border border-neutral-700 bg-neutral-900 px-3 py-2 text-sm text-neutral-100 focus:outline-none focus:border-accent" placeholder="XXXX-XXXX" autocomplete="off"  {{ if .Invalid }} autofocus {{ end }}/>
      {{ end }}
    </div>

    {{ if .Invalid }}
    <div id="login-error" class="dex-error-box rounded-lg border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-400 mb-6">
      Invalid or Expired User Code
    </div>
    {{ end }}
    <button tabindex="3" id="submit-login" type="submit" class="dex-btn theme-btn--primary w-full rounded-lg bg-accent px-4 py-3 text-sm font-bold uppercase tracking-wider text-neutral-950 transition-colors hover:bg-accent/90">Submit</button>
  </form>
</div>

{{ template "footer.html" . }}
