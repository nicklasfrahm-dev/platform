{{ template "header.html" . }}

<div class="theme-panel w-full">
  <h2 class="theme-heading text-base text-neutral-100 mb-6">Log in to {{ issuer }} </h2>
  <div class="w-full">
    {{ range $c := .Connectors }}
      <div class="theme-form-row mb-4">
        <a href="{{ $c.URL }}" target="_self" class="block w-full">
          <button class="dex-btn theme-btn-provider w-full inline-flex items-center justify-center gap-2 rounded-lg bg-accent px-4 py-3 text-sm font-bold uppercase tracking-wider text-neutral-950 transition-colors hover:bg-accent/90">
            <span class="dex-btn-icon dex-btn-icon--{{ $c.Type }}"></span>
            <span class="dex-btn-text">Log in with {{ $c.Name }}</span>
          </button>
        </a>
      </div>
    {{ end }}
  </div>
</div>

{{ template "footer.html" . }}
