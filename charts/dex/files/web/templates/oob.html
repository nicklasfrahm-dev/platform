{{ template "header.html" . }}

  <p class="text-sm text-neutral-100 mb-4">Please copy this code, switch to your application and paste it there:</p>
  <input type="text" class="theme-form-input block w-full rounded-lg border border-neutral-700 bg-neutral-900 px-3 py-2 text-sm text-neutral-100 focus:outline-none focus:border-accent" value="{{ .Code }}" />
</div>
