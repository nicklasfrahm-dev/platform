{{ template "header.html" . }}

<div class="theme-panel w-full">
  <h2 class="theme-heading text-base text-neutral-100 mb-6">Log in to Your Account</h2>
  <form method="post" action="{{ .PostURL }}">
    <div class="theme-form-row mb-4">
      <div class="theme-form-label text-sm font-medium text-neutral-100 mb-1">
        <label for="userid">{{ .UsernamePrompt }}</label>
      </div>
	  <input tabindex="1" required id="login" name="login" type="text" class="theme-form-input block w-full rounded-lg border border-neutral-700 bg-neutral-900 px-3 py-2 text-sm text-neutral-100 focus:outline-none focus:border-accent" placeholder="{{ .UsernamePrompt | lower }}" {{ if .Username }} value="{{ .Username }}" {{ else }} autofocus {{ end }}/>
    </div>
    <div class="theme-form-row mb-4">
      <div class="theme-form-label text-sm font-medium text-neutral-100 mb-1">
        <label for="password">Password</label>
      </div>
	  <input tabindex="2" required id="password" name="password" type="password" class="theme-form-input block w-full rounded-lg border border-neutral-700 bg-neutral-900 px-3 py-2 text-sm text-neutral-100 focus:outline-none focus:border-accent" placeholder="password" {{ if .Invalid }} autofocus {{ end }}/>
    </div>

    {{ if .Invalid }}
      <div id="login-error" class="dex-error-box rounded-lg border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-400 mb-6">
        Invalid {{ .UsernamePrompt }} and password.
      </div>
    {{ end }}

    <button tabindex="3" id="submit-login" type="submit" class="dex-btn theme-btn--primary w-full rounded-lg bg-accent px-4 py-3 text-sm font-bold uppercase tracking-wider text-neutral-950 transition-colors hover:bg-accent/90">Login</button>

  </form>
  {{ if .BackLink }}
  <div class="theme-link-back mt-3">
    <a class="dex-subtle-text text-sm text-neutral-500 hover:text-accent transition-colors" href="{{ .BackLink }}">Select another login method.</a>
  </div>
  {{ end }}
</div>


<script type="text/javascript">
  document.querySelector('form').onsubmit = function(e) {
    var el = document.querySelector('#submit-login');
    el.setAttribute('disabled', 'disabled');
  };
</script>

{{ template "footer.html" . }}
