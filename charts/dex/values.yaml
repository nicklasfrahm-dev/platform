dex:
  enabled: true
  # Mirrors Chart.yaml's version - bump it by hand every time that value
  # changes. ConfigMap volume contents and other values-driven config
  # update in the running pod on their own, but dex only reads them once
  # at startup, so nothing short of a pod restart ever picks them up.
  # Changing this annotation is what forces that restart.
  podAnnotations:
    dex.nicklasfrahm.dev/chart-version: "1.2.0"
  # Rolling out on every chart bump (see podAnnotations above) means old
  # ReplicaSets pile up faster than the chart's default of 10; 3 is
  # plenty for rollback purposes here.
  revisionHistoryLimit: 3
  config:
    logger:
      level: "warn"
      format: "json"
    storage:
      type: kubernetes
      config:
        inCluster: true
    frontend:
      dir: /web
      theme: kontinuum

  volumes:
    - name: dex-theme-root
      configMap:
        name: dex-theme-root
    - name: dex-theme-static
      configMap:
        name: dex-theme-static
    - name: dex-theme-static-img
      configMap:
        name: dex-theme-static-img
    - name: dex-theme-templates
      configMap:
        name: dex-theme-templates
    - name: dex-theme-kontinuum
      configMap:
        name: dex-theme-kontinuum

  volumeMounts:
    - name: dex-theme-root
      mountPath: /web/robots.txt
      subPath: robots.txt
      readOnly: true
    - name: dex-theme-static
      mountPath: /web/static
      readOnly: true
    - name: dex-theme-static-img
      mountPath: /web/static/img
      readOnly: true
    # Mounted file-by-file (subPath) rather than as a whole directory: dex's
    # template loader does its own fs.ReadDir("templates") to discover files,
    # and a directory-mounted ConfigMap's "..data" symlink (used for atomic
    # updates) shows up in that listing and fails to parse as a template.
    - name: dex-theme-templates
      mountPath: /web/templates/approval.html
      subPath: approval.html
      readOnly: true
    - name: dex-theme-templates
      mountPath: /web/templates/device.html
      subPath: device.html
      readOnly: true
    - name: dex-theme-templates
      mountPath: /web/templates/device_success.html
      subPath: device_success.html
      readOnly: true
    - name: dex-theme-templates
      mountPath: /web/templates/error.html
      subPath: error.html
      readOnly: true
    - name: dex-theme-templates
      mountPath: /web/templates/footer.html
      subPath: footer.html
      readOnly: true
    - name: dex-theme-templates
      mountPath: /web/templates/header.html
      subPath: header.html
      readOnly: true
    - name: dex-theme-templates
      mountPath: /web/templates/login.html
      subPath: login.html
      readOnly: true
    - name: dex-theme-templates
      mountPath: /web/templates/oob.html
      subPath: oob.html
      readOnly: true
    - name: dex-theme-templates
      mountPath: /web/templates/password.html
      subPath: password.html
      readOnly: true
    - name: dex-theme-kontinuum
      mountPath: /web/themes/kontinuum
      readOnly: true

httpRoute:
  enabled: false
