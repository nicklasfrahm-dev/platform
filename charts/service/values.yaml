# cluster, environment, location, tenant and domain are automatically
# injected by the `argocd-apps` chart. No need to set them manually.
platform:
  cluster: "dev-lab01"
  environment: "dev"
  location: "lab01"
  tenant: "demo"
  domain: "nicklasfrahm.dev"
  # target selects which infrastructure deploys this service. "Kubernetes"
  # (the default) is deployed by ArgoCD via this chart. Set to
  # "GoogleCloudRunService" to instead have modules/cloudrun-service deploy
  # it to Cloud Run. Unlike the rest of platform.*, this must be set by hand
  # in the service's own 00-base.yml.
  target: "Kubernetes"

image:
  repository: "ghcr.io/nicklasfrahm-dev/axon"
  tag: "v0.1.0"
  pullPolicy: "IfNotPresent"

expose:
  enabled: false
  host: ""
  hostPrefix: ""
  path:
    type: "PathPrefix"
    value: "/"
    stripPrefix: false

gateway:
  name: "public-web-gateway"
  namespace: "platform"

service:
  type: ClusterIP
  port: 80
  containerPort: 8080
  # Cloud Run only (modules/cloudrun-service). Ignored on Kubernetes, which
  # has no per-request timeout at this layer.
  #
  # Request timeout in seconds. Cloud Run defaults to 300s when unset, which
  # forcibly closes long-lived connections (WebSocket, streaming gRPC) with
  # an HTTP/2 GOAWAY(ENHANCE_YOUR_CALM). Set higher (max 3600) for services
  # that hold connections open longer than that. null keeps Cloud Run's
  # default.
  timeoutSeconds: null
  # Follows Kubernetes' appProtocol convention
  # (https://kubernetes.io/docs/concepts/services-networking/service/#application-protocol):
  # "http" or "kubernetes.io/h2c". Only consumed by Cloud Run today
  # (modules/cloudrun-service translates it to Cloud Run's own port name
  # enum); set to "kubernetes.io/h2c" to enable HTTP/2 cleartext to the
  # container, required for gRPC to work reliably.
  appProtocol: "http"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  resource:
    cpu:
      enabled: true
      targetUtilizationPercentage: 100
    memory:
      enabled: true
      targetUtilizationPercentage: 90

env:
  # Add environment variables from hardcoded values.
  # The format is:
  #   VARIABLE: value
  fromLiterals: {}
  # Add environment variables from Kubernetes Secrets.
  # The format is:
  #   VARIABLE:
  #     secretName: keyName
  fromSecrets: {}

resources:
  cpu: 50m
  memory: 100Mi

reliability:
  maxUnavailable: 50%
  schedulingPolicy: ScheduleAnyway

probes:
  liveness:
    enabled: true
    port: 8081
    path: /live
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    port: 8081
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  startup:
    enabled: true
    port: 8081
    path: /startup
    periodSeconds: 10
    failureThreshold: 3

# Annotation-based metrics autodiscovery (see monitoring-client's
# annotationAutodiscovery feature, which scrapes pods carrying these
# k8s.grafana.com annotations).
metrics:
  enabled: false
  # Defaults to service.containerPort when empty.
  port: ""
  path: /metrics
  # Defaults to the autodiscovery feature's own scrape interval/timeout when empty.
  scrapeInterval: ""
  scrapeTimeout: ""
